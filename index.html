<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎰 La Mami Lechera</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

overflow:hidden;

background:
linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.55)),
url("modelo.png");

background-size:cover;
background-position:center;

}

.casino{

width:min(95vw,560px);

border-radius:35px;

padding:30px;

background:
linear-gradient(180deg,#ff7ec3,#ff2b78);

border:8px solid gold;

box-shadow:

0 0 25px gold,

0 0 70px hotpink;

}

.logo{

font-size:52px;

font-weight:900;

letter-spacing:2px;

color:white;

text-align:center;

white-space:nowrap;

text-shadow:

0 0 10px #ff0088,

0 0 30px gold;

margin-bottom:25px;

}

.machine{

background:white;

border-radius:25px;

padding:25px;

}

.reels{

display:flex;

justify-content:center;

gap:15px;

margin-bottom:25px;

}

.reel{

width:110px;

height:120px;

border-radius:20px;

border:6px solid hotpink;

display:flex;

justify-content:center;

align-items:center;

font-size:65px;

background:white;

box-shadow:

inset 0 0 12px rgba(0,0,0,.15);

}

button{

background:#ff2b78;

color:white;

padding:18px 45px;

font-size:24px;

border:none;

border-radius:50px;

font-weight:bold;

cursor:pointer;

transition:.3s;

box-shadow:

0 10px 25px rgba(255,0,120,.35);

}

button:hover{

transform:scale(1.05);

}

#resultado{

margin-top:25px;

font-size:28px;

font-weight:bold;

color:#ff2b78;

min-height:90px;

}

</style>

</head>

<body>

<div class="casino">

<div class="logo">

🎰 LA MAMI LECHERA 🎰

</div>

<div class="machine">

<div class="reels">

<div class="reel" id="r1">💖</div>

<div class="reel" id="r2">👑</div>

<div class="reel" id="r3">💎</div>

</div>

<button onclick="girar()">

🎰 GIRAR 🎰

</button>

<div id="resultado"></div>
</div>

</div>

<script>

const iconos=[
"💖",
"👑",
"💎",
"🎁",
"💰",
"🍀",
"⭐",
"🔥",
"🎉",
"💋"
];

const premios=[
"Premio 1",
"Premio 2",
"Premio 3",
"Premio 4",
"Premio 5",
"Premio 6",
"Premio 7",
"Premio 8",
"Premio 9",
"Premio 10"
];

const ganadores=[2,5,8];

const r1=document.getElementById("r1");
const r2=document.getElementById("r2");
const r3=document.getElementById("r3");
const resultado=document.getElementById("resultado");

function randomEmoji(){
    return iconos[Math.floor(Math.random()*iconos.length)];
}

function girar(){

const boton=document.querySelector("button");

boton.disabled=true;

resultado.innerHTML="";

let vueltas=0;

const giro=setInterval(()=>{

r1.textContent=randomEmoji();
r2.textContent=randomEmoji();
r3.textContent=randomEmoji();

vueltas++;

if(vueltas>=30){

clearInterval(giro);

setTimeout(()=>{

r1.textContent="💖";

},200);

setTimeout(()=>{

r2.textContent="👑";

},700);

setTimeout(()=>{

r3.textContent="💎";

finalizar();

boton.disabled=false;

},1200);

}

},70);

}

function finalizar(){

const gana=Math.random()<0.30;

if(gana){

const premio=

ganadores[Math.floor(Math.random()*ganadores.length)];

resultado.innerHTML=

"🎉<br><span style='font-size:34px'>¡HAS GANADO!</span><br><br><span style='font-size:30px'>"+premios[premio]+"</span>";

}else{

resultado.innerHTML=

"❤️<br><span style='font-size:28px'>Esta vez no ha habido suerte</span>";

}

}

</script>

</body>

</html>
