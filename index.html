<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎰 La Mami Lechera</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:
linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.55)),
url("modelo.png") center center/cover no-repeat;

overflow:hidden;

}

.casino{

width:min(95vw,560px);

background:linear-gradient(180deg,#ff79b8,#ff2c7d);

border-radius:35px;

padding:35px;

border:8px solid gold;

box-shadow:
0 0 25px gold,
0 0 80px hotpink;

text-align:center;

}

.logo{

font-size:44px;

font-weight:bold;

color:white;

margin-bottom:25px;

text-shadow:
0 0 10px #ff0088,
0 0 25px #ff0088;

}

.machine{

background:white;

padding:25px;

border-radius:25px;

}

.reels{

display:flex;

justify-content:center;

gap:15px;

margin-bottom:30px;

}

.reel{

width:110px;

height:120px;

background:#fafafa;

border:6px solid hotpink;

border-radius:20px;

display:flex;

justify-content:center;

align-items:center;

font-size:60px;

box-shadow:
inset 0 0 15px rgba(0,0,0,.15);

}

button{

background:#ff2c7d;

color:white;

padding:18px 45px;

font-size:24px;

border:none;

border-radius:50px;

cursor:pointer;

font-weight:bold;

transition:.25s;

}

button:hover{

transform:scale(1.05);

}

#resultado{

margin-top:30px;

font-size:28px;

font-weight:bold;

color:#ff2c7d;

min-height:90px;

}

</style>

</head>

<body>

<div class="casino">

<div class="logo">

🎰 LA MAMI LECHERA 🎰

</div>

<div class="machine">

<div class="reels">

<div class="reel" id="r1">💖</div>

<div class="reel" id="r2">👑</div>

<div class="reel" id="r3">💎</div>

</div>

<button onclick="girar()">

🎰 GIRAR 🎰

</button>

<div id="resultado"></div>
</div>

</div>

<script>

const iconos=[
"💖",
"👑",
"💎",
"🎁",
"💰",
"🍀",
"⭐",
"🔥",
"🎉",
"💋"
];

const premios=[
"Premio 1",
"Premio 2",
"Premio 3",
"Premio 4",
"Premio 5",
"Premio 6",
"Premio 7",
"Premio 8",
"Premio 9",
"Premio 10"
];

// SOLO ESTOS PREMIOS PODRÁN TOCAR
const ganadores=[2,5,8];

function emoji(){

return iconos[Math.floor(Math.random()*iconos.length)];

}

function girar(){

resultado.innerHTML="";

const boton=document.querySelector("button");

boton.disabled=true;

let vueltas=0;

const animacion=setInterval(()=>{

r1.innerHTML=emoji();
r2.innerHTML=emoji();
r3.innerHTML=emoji();

vueltas++;

if(vueltas>35){

clearInterval(animacion);

setTimeout(()=>{

terminar();

boton.disabled=false;

},400);

}

},80);

}

function terminar(){

const gana=Math.random()<0.30;

if(gana){

const premio=

ganadores[Math.floor(Math.random()*ganadores.length)];

resultado.innerHTML=

"🎉<br><br><span style='font-size:38px'>¡HAS GANADO!</span><br><br><span style='font-size:34px;color:#ff0066'>"+premios[premio]+"</span>";

}else{

resultado.innerHTML=

"❤️<br><br><span style='font-size:30px'>Esta vez no ha habido suerte</span>";

}

}

</script>

</body>

</html>
