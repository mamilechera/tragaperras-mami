<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎰 La Mami Lechera</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{

height:100vh;
display:flex;
justify-content:center;
align-items:center;

background:
linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.55)),
url("modelo.png");

background-size:cover;
background-position:center;

overflow:hidden;

}

.casino{

width:520px;

background:linear-gradient(180deg,#ff7db8,#ff2b78);

border-radius:40px;

padding:35px;

border:8px solid gold;

box-shadow:

0 0 40px gold,

0 0 120px hotpink;

text-align:center;

}

.logo{

font-size:42px;

font-weight:bold;

color:white;

text-shadow:

0 0 15px #ff0088,

0 0 35px #ff0088;

margin-bottom:25px;

}

.machine{

background:white;

border-radius:25px;

padding:25px;

}

.reels{

display:flex;

justify-content:center;

gap:15px;

margin-bottom:25px;

}

.reel{

width:110px;

height:120px;

background:#fafafa;

border:6px solid #ff2b78;

border-radius:18px;

display:flex;

justify-content:center;

align-items:center;

font-size:60px;

box-shadow:

inset 0 0 15px rgba(0,0,0,.15);

}

button{

background:#ff2b78;

color:white;

font-size:24px;

padding:18px 50px;

border:none;

border-radius:50px;

cursor:pointer;

font-weight:bold;

transition:.3s;

box-shadow:0 10px 25px rgba(255,0,100,.4);

}

button:hover{

transform:scale(1.05);

}

#resultado{

margin-top:25px;

font-size:30px;

font-weight:bold;

color:#ff2b78;

min-height:90px;

}

</style>

</head>

<body>

<div class="casino">

<div class="logo">

🎰 LA MAMI LECHERA 🎰

</div>

<div class="machine">

<div class="reels">

<div id="r1" class="reel">💖</div>

<div id="r2" class="reel">👑</div>

<div id="r3" class="reel">💎</div>

</div>

<button>

🎰 GIRAR 🎰

</button>

<div id="resultado"></div>

</div>

</div>

</body>
</html>
